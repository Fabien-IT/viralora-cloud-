name: VIRALORA AI Studio - Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viralora-studio-production
  cancel-in-progress: false

jobs:
  produce:
    name: Produce French and English drafts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install free offline voice engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt piper-tts==1.3.0
          mkdir -p models
          curl -fL --retry 3 -o models/fr_FR-tom-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/tom/medium/fr_FR-tom-medium.onnx
          curl -fL --retry 3 -o models/fr_FR-tom-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/tom/medium/fr_FR-tom-medium.onnx.json
          curl -fL --retry 3 -o models/en_US-ryan-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx
          curl -fL --retry 3 -o models/en_US-ryan-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx.json
      - name: Run VIRALORA Manager and production agents
        run: python agents/manager.py --queue content/queue.json --output dist
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: viralora-review-package
          path: |
            dist/*.mp4
            dist/review-manifest.json
          if-no-files-found: error
          retention-days: 7
