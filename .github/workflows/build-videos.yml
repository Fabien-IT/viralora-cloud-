name: VIRALORA - Build Draft Videos

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "content/**"
      - "requirements.txt"
      - ".github/workflows/build-videos.yml"

permissions:
  contents: read

concurrency:
  group: viralora-video-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          mkdir -p models
          curl -fL --retry 3 -o models/fr_FR-tom-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/tom/medium/fr_FR-tom-medium.onnx
          curl -fL --retry 3 -o models/fr_FR-tom-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/tom/medium/fr_FR-tom-medium.onnx.json
          curl -fL --retry 3 -o models/en_US-ryan-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx
          curl -fL --retry 3 -o models/en_US-ryan-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/medium/en_US-ryan-medium.onnx.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt piper-tts==1.3.0
      - name: Build French and English drafts
        run: python scripts/build_videos.py --input content/queue.json --output dist
      - name: Validate outputs
        run: python scripts/validate_videos.py dist
      - name: Upload draft videos
        uses: actions/upload-artifact@v4
        with:
          name: viralora-drafts
          path: dist/*.mp4
          if-no-files-found: error
          retention-days: 3
